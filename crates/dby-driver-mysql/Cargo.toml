[package]
name = "dby-driver-mysql"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MySQL driver for dby"

[dependencies]
dby-core = { path = "../dby-core" }
async-trait = "0.1"
# 异步驱动：流式 + 取消；纯 Rust flate2（minimal-rust）；rustls + ring 提供 TLS
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring"] }
